# Keeps data fresh with no personal computer switched on: rebuilds the pre-built indexes from
# the challenge resources (IRSA) and deploys the same build to GitHub Pages (primary) and
# Cloudflare Pages (backup). Build artefacts are deployed directly; nothing is committed.
# The Cloudflare backup step runs only when the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set.
name: refresh-and-deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '23 */6 * * *' }]
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Refresh data from IRSA (scheduled and manual runs; keeps previous files if a source is down)
        if: github.event_name != 'push'
        run: |
          node scripts/prebake.mjs || true
          node scripts/mission.mjs || true
          ALLSKY_W=1000 node scripts/allsky.mjs || true
          ALLSKY_W=1600 node scripts/allsky.mjs || true
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: Deploy backup to Cloudflare Pages
        if: env.CF_TOKEN != ''
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: npx --yes wrangler@3 pages deploy dist --project-name skyshift-spherex --branch main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
