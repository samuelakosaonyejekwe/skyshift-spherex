# Checks on every push and pull request: unit tests and build (syntax check, size budget, attribution
# check). SkyShift has no package dependencies, so there is nothing for a dependency audit to check.
# Runs as checks only; it never commits.
name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs
      - run: node --test test/
